roles:
  community_manager:
    label: Community manager
    everything: true
    grantable: true

  firefighter:
    label: Firefighter
    capabilities:
      - case.read
      - case.open
      - case.categorise
      - case.tag
      - case.note
      - case.people
      - case.chat
      - case.reply
      - case.act
      - case.resolve
      - case.reverse
      - case.reopen
      - thread.guard
      - member.note
      - member.guard
      - member.deactivate
      - member.purge
      - member.links
      - link.verdict
      - identity.read
      - audit.read
      - slack.link
      - channel.read
      - channel.all
      - channel.guard
      - app.configure
    grantable: true

  promethean:
    label: Promethean
    capabilities: [channel.read]
    grantable: false

  gardener:
    label: Gardener
    capabilities: [channel.read]
    grantable: true

  analytics:
    label: Analytics
    capabilities:
      - channel.read
      - channel.all
    grantable: true

areas:
  case: Cases
  member: People
  identity: People
  channel: Channels
  engine: Engine
  slack: Account
  access: Access
  app: Dashboard
  api: Public API
  audit: Audit log

record_scopes: [author, channel]

capabilities:
  case.read:
    label: Read every case, note and thread
    area: case
    locked: true
    events: [member/looked_up]

  case.open:
    label: Open, claim and release a case
    area: case
    locked: true
    events: [case/opened, assignee/claimed, assignee/unclaimed, assignee/attached, assignee/detached]

  case.categorise:
    label: Set the category on a case
    area: case
    locked: true
    events: [case/categorised]

  case.tag:
    label: Add and remove case tags
    area: case
    locked: true
    events: [case_tag/added, case_tag/removed, tag/added]

  case.note:
    label: Write, edit and remove case notes
    area: case
    locked: true
    events: [note/noted, note/edited, note/deleted]

  case.people:
    label: Add and remove case participants
    area: case
    locked: true
    events: [participant/attached, participant/detached]

  case.chat:
    label: Post internal case chat
    area: case
    locked: true

  case.reply:
    label: Reply to the reporter
    area: case
    locked: true
    events: [report/answered]

  case.act:
    label: Log an action against a member
    area: case
    locked: true
    events:
      - action/performed
      - action/edited
      - member_guard/opened
      - member_guard/attached
      - member_guard/extended

  case.resolve:
    label: Resolve a case or mark it a duplicate
    area: case
    locked: true
    events: [case/resolved]

  case.reverse:
    label: Reverse a logged action
    area: case
    locked: true
    events: [action/reversed]

  case.reopen:
    label: Reopen a resolved case
    area: case
    locked: true
    events: [case/reopened]

  thread.guard:
    label: Lock or destroy a thread in Slack
    area: case
    locked: true
    events: [thread_guard/opened, thread_guard/lifted, member/session_reset]

  member.note:
    label: Write, edit and remove member notes
    area: member
    locked: true
    events: [note/noted, note/edited, note/deleted]

  member.guard:
    label: Apply a shush or channel ban with no case attached
    area: member
    locked: true
    events:
      - member_guard/opened
      - member_guard/lifted
      - member_guard/extended

  member.deactivate:
    label: Deactivate and reactivate a Slack account
    area: member
    locked: true

  member.purge:
    label: Bulk delete one member's messages
    area: member
    locked: true
    logged: true
    events: [member_purge/queued, member_purge/performed]

  member.read:
    label: See member names in the analytics
    area: member

  member.links:
    label: View suspected duplicate accounts
    area: member
    locked: true
    logged: true

  link.verdict:
    label: Record a verdict on two linked accounts
    area: member
    locked: true
    events: [member_link_verdict/linked, member_link_verdict/unlinked]

  identity.read:
    label: View the real name and email behind a member id
    area: identity
    locked: true
    logged: true

  audit.read:
    label: View Slack audit events
    area: audit
    locked: true
    logged: true

  channel.read:
    label: View analytics for managed channels
    area: channel
    record_scope: channel
    every_account: true

  channel.all:
    label: View analytics for every channel
    area: channel

  channel.share:
    label: Set a channel's audience and readers
    area: channel
    locked: true
    events: [channel_audience/granted, channel_audience/revoked]

  channel.backfill:
    label: Queue a thread replies backfill for a channel
    area: channel

  channel.guard:
    label: Guard a channel and set its bot allow list
    area: channel
    locked: true
    events:
      - channel_guard/opened
      - channel_guard/lifted
      - channel_allow/added
      - channel_allow/removed
      - app_setting/tuned

  channel.purge:
    label: Bulk delete recent channel messages
    area: channel
    locked: true
    logged: true
    events: [channel_purge/queued, channel_purge/performed]

  message.read:
    label: View own message activity in enabled channels
    area: channel
    record_scope: author
    every_account: true

  message.show:
    label: Enable message activity per channel
    area: channel
    locked: true
    events: [message_activity/turned_on, message_activity/turned_off]

  engine.manage:
    label: Run and configure the engine
    area: engine
    locked: true

  slack.link:
    label: Link own Slack account
    area: slack
    events: [slack_account/linked, slack_account/unlinked]

  access.read:
    label: View access holders and their activity
    area: access

  access.grant:
    label: Grant and revoke access
    area: access
    locked: true
    events: [grant/granted, grant/revoked, community_grant/granted, community_grant/revoked, permission/granted, permission/revoked]

  app.flip:
    label: Turn a section of the dashboard on or off
    area: app
    locked: true
    events: [flag/turned_on, flag/turned_off]

  app.configure:
    label: Configure the automod list, canned replies and tags
    area: app
    locked: true
    events: [automod_word/added, automod_word/removed, app_setting/tuned, tag/renamed, tag/merged, tag/removed]

  api.review:
    label: Review requests for public API access
    area: api
    events: [access/requested, access/approved, access/declined]
