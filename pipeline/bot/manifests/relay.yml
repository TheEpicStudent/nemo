display_information:
  name: Shroud
  description: Report something to the Fire Department, with your name or anonymously.
  background_color: "#1c1917"

features:
  bot_user:
    display_name: shroud
    always_online: true
  shortcuts:
    - name: Report anonymously
      type: message
      callback_id: report_anonymous
      description: Report this message to FD without revealing your identity
    - name: Report with my name
      type: message
      callback_id: report_with_name
      description: Report this message to FD, attributing the report to you

oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:write.customize
      - im:history
      - im:write
      - files:read
      - files:write
      - reactions:write
      - users:read

settings:
  event_subscriptions:
    bot_events:
      - message.im
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
