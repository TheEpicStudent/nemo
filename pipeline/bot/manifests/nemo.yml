display_information:
  name: Nemo
  description: "Fire Engine in Slack: cases, actions and member records."
  background_color: "#1c1917"

features:
  bot_user:
    display_name: nemo
    always_online: true
  shortcuts:
    - name: Destroy thread
      type: message
      callback_id: destroy_thread
      description: Save the thread to the case record, then delete it from Slack
    - name: Lock thread
      type: message
      callback_id: lock_thread
      description: Delete new replies until a set date
    - name: Slow mode
      type: message
      callback_id: slowmode_thread
      description: Per-member reply cooldown in this thread
    - name: View message activity
      type: message
      callback_id: message_activity
      description: Viewers, reactions and clicks on your own post
  slash_commands:
    - command: /nemo
      description: Look up members, add notes, open cases, set slow mode, purge messages
      usage_hint: help | queue | lookup @member | note @member | open @member | shush @member 3d | unshush @member | channelban @member #channel 3d | unban @member #channel | slowmode #channel 30s 2h | purge #channel 50 | 3864
      should_escape: true

oauth_config:
  redirect_urls:
    - https://localhost:3000/fd/slack_account/callback
  scopes:
    user:
      - admin
      - admin.analytics:read
      - admin.roles:read
      - admin.conversations:read
      - admin.teams:read
      - admin.users:read
      - admin.users:write
      - auditlogs:read
      - channels:history
      - channels:read
      - channels:write
      - chat:write
      - groups:history
      - groups:write
      - search:read
      - users:read
    bot:
      - chat:write
      - chat:write.customize
      - files:read
      - files:write
      - channels:read
      - channels:history
      - channels:join
      - channels:manage
      - groups:read
      - groups:history
      - groups:write
      - reactions:read
      - reactions:write
      - users:read
      - users:read.email

settings:
  event_subscriptions:
    bot_events:
      - channel_archive
      - channel_created
      - channel_left
      - channel_rename
      - channel_unarchive
      - group_archive
      - group_left
      - group_rename
      - group_unarchive
      - member_joined_channel
      - member_left_channel
      - message.channels
      - message.groups
      - reaction_added
      - team_join
      - user_change
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
